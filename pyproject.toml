[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-hpfc"
version = "0.1.0"
description = "Hourly Price Forward Curve (power) et modules de données de marché réutilisables"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "entsoe-py>=0.6.19",
    "holidays>=0.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.38", "plotly>=5.22", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
