[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-hpfc"
version = "0.1.0"
description = "Hourly Price Forward Curve (power) et modules de données de marché réutilisables"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Clément Corve"}]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "entsoe-py>=0.6.19",
    "holidays>=0.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.38", "plotly>=5.22", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E731"]   # zip() sans strict= : comportement inchangé ; lambdas nommées dans les tests
