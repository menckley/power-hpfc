name: HPFC quotidienne

on:
  schedule:
    - cron: "0 6 * * *"        # chaque jour à 06:00 UTC (08:00 à Paris en été, 07:00 en hiver)
  workflow_dispatch:            # bouton « Run workflow » pour un lancement manuel

permissions:
  contents: write               # nécessaire pour pousser l'archive dans le dépôt

concurrency:
  group: hpfc-daily             # jamais deux runs en même temps
  cancel-in-progress: false

jobs:
  hpfc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le dépôt (code + archive)
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Construire la courbe de la dernière séance EEX
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m hpfc.cli run --market FR

      - name: Archiver dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau à archiver"
          else
            git commit -m "Archive HPFC FR $(date -u +%Y-%m-%d)"
            git push
          fi
