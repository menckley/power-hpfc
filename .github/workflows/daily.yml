name: HPFC quotidienne

on:
  schedule:
    - cron: "0 5 * * *"        # chaque jour à 05:00 UTC (07:00 à Paris en été, 06:00 en hiver)
  workflow_dispatch:            # bouton « Run workflow » pour un lancement manuel

permissions:
  contents: read                # le code n'est que lu ; l'archive est poussée dans le dépôt de données (jeton dédié)

concurrency:
  group: hpfc-daily             # jamais deux runs en même temps
  cancel-in-progress: false

jobs:
  hpfc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false   # le jeton du dépôt de code n'a pas à rester dans .git

      - name: Récupérer l'archive de données (dépôt privé menckley/power-hpfc-data, dans data/)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: menckley/power-hpfc-data
          token: ${{ secrets.DATA_REPO_TOKEN }}   # jeton GitHub : Contents en lecture et écriture sur ce dépôt
          path: data

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet
        run: pip install -e ".[dev]"

      - name: Construire la courbe de la dernière séance EEX
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m hpfc.cli run --market FR

      - name: Compléter le journal des €STR (BCE)
        id: estr
        continue-on-error: true     # API BCE en panne : rattrapé au prochain run, sans trou
        run: python -m hpfc.cli estr

      - name: Archiver les settlements d'options EEX
        id: options
        continue-on-error: true     # n'empêche jamais l'archivage de la courbe du jour
        run: python -m hpfc.cli options --market FR

      - name: Mesurer la précision des courbes face au day-ahead réalisé
        id: accuracy
        continue-on-error: true     # n'empêche jamais l'archivage de la courbe du jour
        run: python -m hpfc.cli accuracy --market FR

      - name: Archiver dans le dépôt de données
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau à archiver"
          else
            git commit -m "Archive HPFC FR $(date -u +%Y-%m-%d)"
            # reprise : la branche distante a pu avancer entre-temps
            for essai in 1 2 3; do
              if git pull --rebase && git push; then
                exit 0
              fi
              echo "Échec du push (essai $essai/3)"
              git rebase --abort 2>/dev/null || true
              sleep $((essai * 10))
            done
            echo "::error::Impossible de pousser l'archive après 3 essais"
            exit 1
          fi

      - name: Signaler les étapes optionnelles en échec
        if: always()                # après l'archivage : n'empêche jamais la courbe du jour
        env:
          ESTR: ${{ steps.estr.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          ACCURACY: ${{ steps.accuracy.outcome }}
        run: |
          echec=0
          for etape in ESTR OPTIONS ACCURACY; do
            if [ "${!etape}" = "failure" ]; then
              echo "::error::Étape optionnelle en échec : $etape"
              echec=1
            fi
          done
          exit $echec
